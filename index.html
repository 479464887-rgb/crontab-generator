<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Crontab Generator - Cron表达式可视化构建器"><meta property="og:title" content="Crontab Generator"><title>Crontab Generator</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}header h1{font-size:20px;color:#58a6ff}.lang-switch{display:flex;gap:4px}.lang-switch button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.lang-switch button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}.container{max-width:900px;margin:0 auto;padding:24px}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:20px}.card-header{background:#21262d;padding:10px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #30363d}.card-body{padding:16px}.field-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #21262d;flex-wrap:wrap}.field-row:last-child{border-bottom:none}.field-label{min-width:80px;font-size:13px;color:#58a6ff;font-weight:500}.field-options{display:flex;gap:6px;flex-wrap:wrap}.field-options button{padding:4px 10px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;cursor:pointer;font-size:12px}.field-options button.active,.field-options button:hover{background:#1f6feb;border-color:#1f6feb;color:#fff}.field-input{display:flex;gap:8px;align-items:center}.field-input input,.field-input select{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;padding:6px 10px;border-radius:4px;font-size:13px;width:80px}.result-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:16px;font-family:monospace;margin-top:16px}.result-cron{font-size:24px;color:#7ee787;text-align:center;margin-bottom:12px;letter-spacing:2px}.result-desc{font-size:13px;color:#8b949e;text-align:center}.next-runs{margin-top:12px}.next-runs h4{font-size:12px;color:#8b949e;margin-bottom:6px}.next-runs div{font-family:monospace;font-size:12px;color:#c9d1d9;padding:2px 0}.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.presets button{background:#21262d;color:#8b949e;border:1px solid #30363d;padding:6px 14px;border-radius:16px;cursor:pointer;font-size:12px}.presets button:hover{color:#58a6ff;border-color:#58a6ff}</style></head><body><header><h1>⏰ Crontab Generator</h1><div class="lang-switch"><button class="active" onclick="setLang('zh')">中文</button><button onclick="setLang('en')">EN</button></div></header><div class="container"><div class="presets"><button onclick="setPreset('* * * * *')">每分钟</button><button onclick="setPreset('0 * * * *')">每小时</button><button onclick="setPreset('0 0 * * *')">每天午夜</button><button onclick="setPreset('0 0 * * 0')">每周日</button><button onclick="setPreset('0 0 1 * *')">每月1日</button><button onclick="setPreset('*/5 * * * *')">每5分钟</button><button onclick="setPreset('0 9 * * 1-5')">工作日9AM</button></div><div class="card"><div class="card-header">配置Cron表达式</div><div class="card-body"><div class="field-row"><span class="field-label">分钟</span><div class="field-options" id="minuteBtns"><button onclick="setFieldValue('minute','*')" class="active">* (每分钟)</button><button onclick="setFieldValue('minute','*/5')">*/5</button><button onclick="setFieldValue('minute','*/15')">*/15</button><button onclick="setFieldValue('minute','*/30')">*/30</button></div><div class="field-input"><input type="text" id="minute" value="*" onchange="updateCron()" placeholder="*"></div></div><div class="field-row"><span class="field-label">小时</span><div class="field-options" id="hourBtns"><button onclick="setFieldValue('hour','*')" class="active">* (每小时)</button><button onclick="setFieldValue('hour','0')">0 (午夜)</button><button onclick="setFieldValue('hour','9')">9</button><button onclick="setFieldValue('hour','9,17')">9,17</button></div><div class="field-input"><input type="text" id="hour" value="*" onchange="updateCron()" placeholder="*"></div></div><div class="field-row"><span class="field-label">日</span><div class="field-options" id="dayBtns"><button onclick="setFieldValue('day','*')" class="active">* (每天)</button><button onclick="setFieldValue('day','1')">1</button><button onclick="setFieldValue('day','15')">15</button></div><div class="field-input"><input type="text" id="day" value="*" onchange="updateCron()" placeholder="*"></div></div><div class="field-row"><span class="field-label">月</span><div class="field-options" id="monthBtns"><button onclick="setFieldValue('month','*')" class="active">* (每月)</button><button onclick="setFieldValue('month','1')">1月</button><button onclick="setFieldValue('month','6')">6月</button><button onclick="setFieldValue('month','1,7')">1,7月</button></div><div class="field-input"><input type="text" id="month" value="*" onchange="updateCron()" placeholder="*"></div></div><div class="field-row"><span class="field-label">星期</span><div class="field-options" id="dowBtns"><button onclick="setFieldValue('dow','*')" class="active">* (每天)</button><button onclick="setFieldValue('dow','0')">日</button><button onclick="setFieldValue('dow','1-5')">一~五</button><button onclick="setFieldValue('dow','6,0')">六,日</button></div><div class="field-input"><input type="text" id="dow" value="*" onchange="updateCron()" placeholder="*"></div></div></div></div><div class="result-box"><div class="result-cron" id="cronExpr">* * * * *</div><div class="result-desc" id="cronDesc">每分钟执行</div><div class="next-runs"><h4>接下来5次执行时间:</h4><div id="nextRuns"></div></div></div></div><script>let lang='zh';let state={minute:'*',hour:'*',day:'*',month:'*',dow:'*'};function setLang(l){lang=l;document.querySelectorAll('.lang-switch button').forEach((b,i)=>b.classList.toggle('active',(i===0&&l==='zh')||(i===1&&l==='en')))}function setPreset(cron){const parts=cron.split(' ');['minute','hour','day','month','dow'].forEach((f,i)=>{state[f]=parts[i]||'*';document.getElementById(f).value=state[f]});updateCron();highlightActive()}function setFieldValue(field,val){state[field]=val;document.getElementById(field).value=val;updateCron();highlightActive()}function highlightActive(){['minute','hour','day','month','dow'].forEach(f=>{const val=state[f];document.querySelectorAll('#'+f+'Btns button').forEach(b=>b.classList.toggle('active',b.textContent.includes(val)&&!b.textContent.includes('/')&&val.indexOf(',')===-1))})}function updateCron(){['minute','hour','day','month','dow'].forEach(f=>state[f]=document.getElementById(f).value||'*');const expr=state.minute+' '+state.hour+' '+state.day+' '+state.month+' '+state.dow;document.getElementById('cronExpr').textContent=expr;document.getElementById('cronDesc').textContent=describeCron(state);calcNextRuns(state)}function describeCron(s){const m=s.minute,h=s.hour,d=s.day,M=s.month,w=s.dow;if(m==='*'&&h==='*'&&d==='*'&&M==='*'&&w==='*')return '每分钟执行 / Every minute';let desc='';if(m==='*')desc='每分钟';else if(m.startsWith('*/'))desc='每'+m.slice(2)+'分钟';else desc=m+'分';desc+=' ';if(h==='*'){if(m==='*')desc='每小时'}else if(h.startsWith('*/'))desc='每'+h.slice(2)+'小时';else desc='在 '+h+':00';if(d!=='*')desc+=', 每月'+d+'日';if(M!=='*')desc+=', '+M+'月';if(w!=='*'){let wd={'0':'周日','1':'周一','2':'周二','3':'周三','4':'周四','5':'周五','6':'周六'};if(w.includes('-'))desc+=', '+wd[w.split('-')[0]]+'至'+wd[w.split('-')[1]];else if(w.includes(','))desc+=', '+w.split(',').map(x=>wd[x]||x).join('和');else desc+=', 每'+wd[w]}return desc}function calcNextRuns(s){const runs=[];let d=new Date();d.setSeconds(0,0);for(let i=0;i<2000;i++){d=new Date(d.getTime()+60000);const m=d.getMinutes(),h=d.getHours(),dom=d.getDate(),month=d.getMonth()+1,dow=d.getDay();if(matchField(s.minute,m)&&matchField(s.hour,h)&&matchField(s.day,dom)&&matchField(s.month,month)&&matchField(s.dow,dow)){runs.push(d);if(runs.length>=5)break}}document.getElementById('nextRuns').innerHTML=runs.map(d=>d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})).join('<br>')}function matchField(pattern,value){if(pattern==='*')return true;for(const part of pattern.split(',')){if(part.includes('/')){const[range,step]=part.split('/');const start=range==='*'?0:parseInt(range);if((value-start)%parseInt(step)===0)return true}else if(part.includes('-')){const[lo,hi]=part.split('-').map(Number);if(value>=lo&&value<=hi)return true}else if(parseInt(part)===value)return true}return false}updateCron()</script></body></html>
